<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&display=swap"
      rel="stylesheet"
    />
    
    <title>Basic Calculator</title>
  </head>
  <body>
    <h1 class="titulo">♡ Basic Calculator ♡</h1>
      <div class="calculadora">
        <p id="pantallaTotal"></p>

        <div class="botones">
          <button onclick="borrarTodo()">ac</button>
          <button onclick="borrar()">C</button>
          <button onclick="agregarOperador('%')">%</button>
          <button onclick="agregarOperador('÷')">÷</button>

          <button onclick="agregarNumero('7')">7</button>
          <button onclick="agregarNumero('8')">8</button>
          <button onclick="agregarNumero('9')">9</button>
          <button onclick="agregarOperador('x')">x</button>

          <button onclick="agregarNumero('4')">4</button>
          <button onclick="agregarNumero('5')">5</button>
          <button onclick="agregarNumero('6')">6</button>
          <button onclick="agregarOperador('-')">-</button>

          <button onclick="agregarNumero('1')">1</button>
          <button onclick="agregarNumero('2')">2</button>
          <button onclick="agregarNumero('3')">3</button>
          <button class="suma" onclick="agregarOperador('+')">+</button>

          <button onclick="agregarNumero('0')">0</button>
          <button class="igual" onclick="obtenerTotal()">=</button>
        </div>
      </div>

    <script>
      let num1 = "";
      let num2 = "";
      let actual;
      let signo = "";

      function agregarNumero(numero = 0) {
        if (signo) {
          num2 += numero;
          console.log("N2: ", num2);
        } else {
          num1 += numero;
          console.log("N1: ", num1);
        }

        actualizarPantalla();
      }

      function agregarOperador(operador) {
        if (num1 && !signo) {
          signo = operador;
          console.log(operador);
        }

        actualizarPantalla();
      }

      function obtenerTotal() {
        if (!num1 || !signo || !num2) {
          alert("Realice la operacion");
          return;
        }
        //console.log(num1, num2, total, signo);
        let total = 0;
        let nu1 = parseInt(num1);
        let nu2 = parseInt(num2);

        switch (signo) {
          case "+":
            total = nu1 + nu2;

            break;

          case "-":
            total = nu1 - nu2;

            break;

          case "x":
            total = nu1 * nu2;

            break;
          case "÷":
            total = nu1 / nu2;
            total = total.toFixed(2);

            break;
          case "%":
            total = (nu1 * nu2) / 100;
            total = total.toFixed(2);

            break;

          default:
            alert("ERROR: seleccione alguna de las operaciones");
            break;
        }
        num1 = total + "";
        signo = "";
        num2 = "";

        actualizarPantalla();
      }

      function borrarTodo() {
        num1 = "";
        signo = "";
        num2 = "";

        actualizarPantalla();
      }
      function borrar() {
        if (num2) {
          num2 = num2.slice(0, -1);
        } else if (signo) {
          signo = "";
        } else {
          num1 = num1?.slice(0, -1);
        }
        actualizarPantalla();
      }

      function actualizarPantalla() {
        //document.getElementById("pantallaTotal").innerHTML = num1;
        document.getElementById("pantallaTotal").innerHTML =
          `${num1} ${signo} ${num2} `;
      }
    </script>
  </body>
</html>
