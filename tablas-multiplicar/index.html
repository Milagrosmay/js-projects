<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Tablas de multiplicar</title>
  </head>
  <body>
    <h1 class="titulo">Multiplicacion</h1>
    <div class="formulario">
      <form>
        <label for="numero1"
          >Ingrese el numero del cual desea la tabla de multiplicar</label
        >
        <br />
        <input
          type="number"
          name="numero1"
          id="numero1"
          placeholder="Primer numero"
        />
        <br />
        <br />
        <label for="numero2"
          >Ingrese hasta que numero quiere que se muestre las
          multiplicaciones</label
        >
        <br />
        <input
          type="number"
          name="numero2"
          id="numero2"
          placeholder="Segundo numero"
        />
        <br />
        <br />
        <button type="button" onclick="multiplicar()" id="boton">
          Multiplicar
        </button>
      </form>
      <p id="pantallaResultado"></p>
    </div>
    <script>
      

      function multiplicar() {
        let numeroUno = document.getElementById("numero1").value;
        let numeroDos = document.getElementById("numero2").value;
        let resultado = "";

        numeroUno = parseInt(numeroUno);
        numeroDos = parseInt(numeroDos);

        for (let i = 1; i <= numeroDos; i++) {
          let operacion = numeroUno + " * " + i + " = " + numeroUno * i;
          resultado += operacion + "<br>";

          // resultado = i*numeroDos;
          // console.log(resultado);
          
        }
        document.getElementById("pantallaResultado").innerHTML = resultado;
      }
    </script>
  </body>
</html>
